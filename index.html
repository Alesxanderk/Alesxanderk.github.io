<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Learning</title>
		<link rel="stylesheet" href="index.css">
		<script src="index.js"></script>
	</head>
	<body>
		<div id="customText" class="view">
			<textarea id="textCustom" class="text">Many people enjoy traveling because it allows them to discover new places and cultures. When you visit another country, you can try different food, hear new languages, and meet interesting people. Traveling also helps you learn more about the world and understand how other people live their daily lives.

Traveling can be fun, but it also has some challenges. Sometimes trips are expensive, and long journeys can be tiring. You may feel confused in a new place if you do not know the language or the customs. However, these problems can help you become more independent and confident.

In my opinion, traveling is a great way to grow as a person. It teaches you to be open-minded and patient. Even short trips can give you new experiences and good memories. For these reasons, many people try to travel whenever they have the opportunity.</textarea>
			<button id="btnStartCustom" class="btn">Comenzar</button>
		</div>
		<div id="work" class="view hide">
			<button id="btnReturnWork" class="btn">Regresar</button>
			<div id="workSpace" class="workSpace"></div>
			<div class="footer">
				<button id="btnPlay" class="btn">Play</button>
				<select id="selectSpeed" class="select-f">
					<option value="0.4">0.4x</option>
					<option value="0.6">0.6x</option>
					<option value="0.8">0.8x</option>
					<option value="1.0" selected>1.0x</option>
					<option value="1.2">1.2x</option>
					<option value="1.4">1.4x</option>
					<option value="1.6">1.6x</option>
				</select>
				<select id="selectPause" class="select-f">
					<option value="200">0.2 seg</option>
					<option value="400">0.4 seg</option>
					<option value="600">0.6 seg</option>
					<option value="800" selected>0.8 seg</option>
					<option value="1000">1 seg</option>
					<option value="1200">1.2 seg</option>
					<option value="1400">1.4 seg</option>
					<option value="1600">1.6 seg</option>
				</select>
				<select id="selectMode" class="select-f">
					<option value="parrafo">Parrafo</option>
					<option value="oracion">Oracion</option>
					<option value="palabra">Palabra</option>
				</select>
			</div>
		</div>
		
	</body>
</html>
